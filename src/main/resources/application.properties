spring.application.name=mod-craft
spring.datasource.url=jdbc:h2:mem:modcraft;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# --- Usage reporting (trace) ---
# On start-up the service sends ONE "startup" event to the trace usage-tracking service:
# the program name ("mod-craft"), its version, and the tag service=true. Nothing per request,
# and nothing about mods, modpacks, users, hosts or addresses. Sent off the main thread; a
# trace server that is down or slow is a dropped report, never a failed start-up or a blocked
# request. Set USAGE_REPORTING_ENABLED=false (or usage-reporting.enabled=false) to turn it off;
# TRACE_USAGE_REPORTING=off or DO_NOT_TRACK=1 also turn it off and win over this setting. The
# key is the write key issued to mod-craft; it can only add usage events and is not secret.
# Details: https://github.com/Stephenson-Software/trace#usage-reporting
usage-reporting.enabled=${USAGE_REPORTING_ENABLED:true}
usage-reporting.endpoint=${USAGE_REPORTING_ENDPOINT:https://trace.danielstephenson.dev}
usage-reporting.key=${USAGE_REPORTING_KEY:9kabvcH3S3rRKeeaIVxLL5jtWiQamY2EWCEvTbzthME}
# The version tag; filled in from the Maven project version at build time.
usage-reporting.version=@project.version@
